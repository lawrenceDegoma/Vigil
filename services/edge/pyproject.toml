[project]
name = "vigil-edge"
version = "0.1.0"
description = "Vigil edge service: local camera capture, motion analysis, and incident detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# Plotting for offline analysis on a development machine; not installed on the Pi.
plot = ["matplotlib>=3.8"]

[project.scripts]
vigil = "vigil_edge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: longer end-to-end runs (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["vigil_edge", "helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]

# OpenCV's bundled stubs are imprecise about numpy dtypes; treat cv2 as untyped
# and keep our own array annotations at module boundaries.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "picamera2", "picamera2.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
