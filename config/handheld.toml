# Overrides for analyzing handheld phone footage (e.g. a recorded episode).
# Camera stabilization compensates for hand movement before measuring motion;
# camera-motion suppression is relaxed because residual shake remains.
# Unspecified keys keep the built-in defaults.

[motion]
stabilize = true

[detectors.convulsion]
max_camera_motion = 0.8
max_travel = 0.35
