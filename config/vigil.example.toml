# Vigil edge configuration — example with the built-in defaults.
#
# Every threshold below is an EXPERIMENTAL engineering default chosen to be
# tuned against labeled footage. None is medically validated.
# Units: time in seconds; motion/flow are resolution-independent (fractions of
# the frame, or frame-widths per second).
# Secrets never belong here — use environment variables (.env).

[subject]
name = "Subject"     # display name used in alert text, e.g. your dog's name
profile = "dog"      # severity mapping + wording (see vigil_edge/profiles.py)

[source]
target_fps = 15.0    # analysis frame rate; inputs are subsampled to this

[preprocess]
width = 320          # analysis width in pixels
blur_kernel = 5      # odd; 0 disables
# Normalized polygon limiting analysis to where the subject usually is.
# Empty = whole frame. Example: roi = [[0.1, 0.3], [0.9, 0.3], [0.9, 1.0], [0.1, 1.0]]
roi = []
# Analysis crop [x, y, w, h] (normalized, full frame) applied before resizing: puts more
# pixels on the resting area. With Picamera2, raise camera.analysis_size (e.g. [640, 360])
# so the crop has real resolution. Empty = full frame.
crop = []

[motion]
diff_threshold = 14  # grey-level change that counts as motion
stabilize = false    # true for handheld footage; false for a fixed camera
flow = true          # dense optical flow (direction / oscillation features)
flow_width = 160     # optical-flow resolution (CPU cost control on the Pi)
min_region_area = 0.0004
slow_lag_seconds = 0.25   # lagged difference for slow movements; 0 disables

[window]
seconds = 5.0
step_seconds = 0.5
activity_floor = 0.004
band_hz = [1.0, 6.0]       # rhythmic band for convulsion-like motion (< target_fps/2)
low_band_hz = [0.4, 1.2]   # slow band for retching-like motion

[detectors.convulsion]
mode = "alert"             # off | shadow | alert
threshold = 0.5
onset_seconds = 10.0       # persistence before an incident opens (DESIGN suggests 10–15 s)
min_active_ratio = 0.6
active_ratio_ramp = [0.5, 0.9]
activity_ramp = [0.006, 0.03]
flow_ramp = [0.02, 0.12]
periodicity_ramp = [0.12, 0.4]
rhythm_floor = 0.35
max_travel = 0.1             # net movement across the frame within a window
max_camera_motion = 0.05     # frame-widths/s; raise for handheld footage
max_lighting_change = 0.06
max_region_area = 0.6

[detectors.vomiting]       # EXPERIMENTAL — shadow mode by default (ADR-005)
mode = "shadow"
threshold = 0.35
onset_seconds = 4.0
min_active_ratio = 0.6
active_ratio_ramp = [0.2, 0.5]       # applied to the slow (lagged) motion channel
activity_ramp = [0.001, 0.004]
low_periodicity_ramp = [0.15, 0.4]
max_activity = 0.08
max_flow = 0.08
max_travel = 0.06
max_camera_motion = 0.05
max_lighting_change = 0.06

[incident]
gap_tolerance_seconds = 3.0
end_quiet_seconds = 8.0
merge_gap_seconds = 30.0
recovery_observation_seconds = 120.0
early_warning_window_seconds = 600.0

[recording]                # event-only clips + retention (DESIGN §5.3)
enabled = true
pre_event_seconds = 30.0
post_event_seconds = 120.0
max_clip_seconds = 600.0   # longer episodes continue in a new clip
record_shadow = true       # short clips for shadow detections, for review
retention_days = 30        # ordinary clips expire; admin-preserved clips are kept
disk_quota_gb = 8.0        # oldest unpreserved clips deleted beyond this
min_free_gb = 2.0          # keep this much free on the data volume
software_width = 640       # software recorder only (non-Picamera2 sources)
software_jpeg_quality = 80

[camera]                   # Phase 2: live capture
backend = "picamera2"      # picamera2 | opencv (USB webcam for development)
device = 0                 # opencv device index
fps = 15.0
main_size = [1280, 720]    # recorded by the hardware H.264 encoder
analysis_size = [320, 180] # lores stream used for analysis
bitrate = 2000000
hflip = false
vflip = false
autofocus = "once"         # once | continuous | manual — continuous AF can hunt and mimic motion
lens_position = 1.0        # dioptres, for autofocus = "manual" (1.0 ≈ 1 m)

[service]                  # Phase 2: long-running service
device_id = "dev-device"   # overridden by VIGIL_DEVICE_ID
data_dir = "./data/edge"   # overridden by VIGIL_DATA_DIR
heartbeat_seconds = 60.0
housekeeping_seconds = 300.0
camera_stall_seconds = 5.0
reconnect_min_seconds = 1.0
reconnect_max_seconds = 60.0
outbox_max_rows = 20000
